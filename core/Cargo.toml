[package]
name = "space-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false
rust-version = "1.91"

[features]
# Stellt Test-Hilfsfunktionen (z. B. Zugriff auf den Endpoint) bereit.
test-utils = []

[dependencies]
# Vorschaubilder: nur reine Rust-Decoder, ohne Video/AVIF (kein C-Code für fremde Dateien).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
kamadak-exif = "0.6"
# JPEG mit DCT-Skalierung (1/2 … 1/8) für schnelle Vorschaubilder.
jpeg-decoder = { version = "0.3", default-features = false }
lofty = "0.25"
blake3 = "1"
tokio = { version = "1.0", features = ["full"] }
rusqlite = { version = "0.41", features = ["bundled"] }
iroh = "1.4.1"
iroh-blobs = { version = "0.103.1", features = ["fs-store"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
tracing = "0.1"
directories = "5.0"
libc = "0.2"
fastrand = "2"
getrandom = "0.4"
data-encoding = "2"
walkdir = "2.5"
notify = "8"
n0-future = "0.3"
# Lokaler Streaming-Server (bereits über iroh im Baum).
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
# Freigabelinks: Krypto aus ring (bereits über rustls im Baum), HTTPS-Client für R2/S3.
ring = "0.17"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
# Entpacken: nur reine Rust-Teile (Deflate über miniz_oxide, Deflate64, AES); kein C-Code für
# fremde Archive. tar ohne xattr (keine erweiterten Attribute aus Archiven übernehmen).
zip = { version = "9.4", default-features = false, features = ["aes-crypto", "deflate-flate2", "deflate64"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4", default-features = false }
# DOCX-Leseansicht: XML lesen ohne DTD/Entitäten-Auflösung (keine XXE-Angriffe möglich).
quick-xml = "0.42"
lopdf = { version = "0.47", default-features = false }
# Nur die Datentypen (kein „builder“); RC-Version exakt festgelegt, siehe docs/DEPENDENCIES.md
cms = { version = "=0.3.0-rc.1", default-features = false, features = ["std"] }
x509-cert = { version = "0.3", default-features = false, features = ["std", "builder"] }
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "pkcs8", "alloc"] }
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
sha2 = "0.11"
# Nur zum Prüfen fremder Signaturen (öffentliche Schlüssel)
rsa = { version = "0.10", default-features = false, features = ["std", "encoding", "pkcs1v15"] }

[dev-dependencies]
tempfile = "3"
space-core = { path = ".", features = ["test-utils"] }
