[package]
name = "space-core"
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.91"

[features]
# Stellt Test-Hilfsfunktionen (z. B. Zugriff auf den Endpoint) bereit.
test-utils = []

[dependencies]
tokio = { version = "1.0", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
iroh = "1.4.1"
iroh-blobs = { version = "0.103.1", features = ["fs-store"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
tracing = "0.1"
directories = "5.0"
libc = "0.2"
fastrand = "2"
getrandom = "0.2"
data-encoding = "2"
walkdir = "2.5"
notify = "8"

[dev-dependencies]
tempfile = "3"
n0-future = "0.3"
space-core = { path = ".", features = ["test-utils"] }
