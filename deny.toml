# cargo-deny: Richtlinien für Abhängigkeiten (https://embarkstudios.github.io/cargo-deny/)

[graph]
all-features = true

[advisories]
# Sicherheitslücken (RustSec) lassen den Build scheitern; nicht mehr gepflegte Crates werden gemeldet.
version = 2
yanked = "deny"
# Nicht mehr gepflegte Crates nur bei eigenen (direkten) Abhängigkeiten melden;
# indirekte stammen aus Iroh und werden dort verfolgt. Sicherheitslücken scheitern immer.
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
# Freie, mit einer späteren Veröffentlichung verträgliche Lizenzen.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "0BSD",
    "Unlicense",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Eigene Pfad-Abhängigkeiten (space-core) sind erlaubt.
allow-wildcard-paths = true

[sources]
# Nur crates.io – keine Git-Abhängigkeiten oder fremden Registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[licenses.private]
# Eigene, nicht veröffentlichte Crates (Lizenz wird vor der Veröffentlichung festgelegt).
ignore = true
