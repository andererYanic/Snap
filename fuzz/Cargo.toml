[package]
name = "snap-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "GPL-3.0-only"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
space-core = { path = "../core" }
iroh-blobs = "0.103"
serde_json = "1"
chrono = "0.4"
tokio = { version = "1", features = ["rt", "io-util"] }
tempfile = "3"
walkdir = "2"
zip = { version = "9.4", default-features = false, features = ["deflate-flate2"] }

# Eigener Workspace, damit das Haupt-Workspace stabil (ohne nightly) baut.
[workspace]
members = ["."]

[[bin]]
name = "invite_code"
path = "fuzz_targets/invite_code.rs"
test = false
doc = false
bench = false

