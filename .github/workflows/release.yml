# Signierte Releases: APK (eigener Schlüssel), Linux-Dienst, Flatpak, SBOMs, Prüfsummen und
# Herkunftsnachweise (GitHub-Attestierung). Ausgelöst durch ein Versions-Tag `v*`.
#
# Benötigte Secrets (nie im Repository):
#   SNAP_KEYSTORE_B64       – Android-Keystore, Base64-kodiert
#   SNAP_KEYSTORE_PASSWORD  – Passwort des Keystores
#   SNAP_KEY_ALIAS          – Alias des Schlüssels
#   SNAP_KEY_PASSWORD       – Passwort des Schlüssels
# Ohne Keystore bricht der Release ab (nie mit dem Debug-Schlüssel veröffentlichen).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Feste Werkzeugversion für reproduzierbare Ergebnisse (siehe docs/RELEASES.md)
  RUST_VERSION: "1.97.0"

jobs:
  apk:
    name: APK (signiert)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_NDK_VERSION: 27.3.13750724
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: cargo-ndk, Android-NDK und -Plattform
        run: |
          cargo install cargo-ndk --locked --version 4.1.2
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ANDROID_NDK_VERSION" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
      - run: npm ci --no-fund --no-audit
        working-directory: apps/mobile/app
      - name: Keystore aus dem Secret
        env:
          KEYSTORE_B64: ${{ secrets.SNAP_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "Kein Keystore-Secret – Release abgebrochen."; exit 1; fi
          umask 077
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/snap.keystore"
      - name: APK bauen
        working-directory: apps/mobile/app/android
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
          SNAP_KEYSTORE: ${{ runner.temp }}/snap.keystore
          SNAP_KEYSTORE_PASSWORD: ${{ secrets.SNAP_KEYSTORE_PASSWORD }}
          SNAP_KEY_ALIAS: ${{ secrets.SNAP_KEY_ALIAS }}
          SNAP_KEY_PASSWORD: ${{ secrets.SNAP_KEY_PASSWORD }}
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=/snap --remap-path-prefix=$HOME/.cargo=/cargo"
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64 --no-daemon
      - name: Signatur prüfen, ohne Google-Dienste
        working-directory: apps/mobile/app/android
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/cert.txt"
          if grep -q "CN=Android Debug" "$RUNNER_TEMP/cert.txt"; then echo "Mit Debug-Schlüssel signiert"; exit 1; fi
          for d in $(unzip -l "$apk" | grep -oE "classes[0-9]*\.dex"); do unzip -p "$apk" "$d"; done > "$RUNNER_TEMP/dex"
          if grep -aqE "Lcom/google/android/gms/|Lcom/google/firebase/" "$RUNNER_TEMP/dex"; then exit 1; fi
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$apk" "$GITHUB_WORKSPACE/out/snap-${GITHUB_REF_NAME}.apk"
      - name: Keystore entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/snap.keystore"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk
          path: out/

  linux:
    name: Linux-Dienst und CLI
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Bauen (reproduzierbar)
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=/snap --remap-path-prefix=$HOME/.cargo=/cargo"
          cargo build --release --locked -p space-daemon
          mkdir -p out pkg
          install -m755 target/release/space-daemon pkg/space-daemon
          cp LICENSE README.md pkg/
          # Feste Zeitstempel, Reihenfolge und Besitzer im Archiv
          tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 --numeric-owner \
            -C pkg -cf - . | gzip -n > "out/snap-daemon-${GITHUB_REF_NAME}-linux-x86_64.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: out/

  flatpak:
    name: Flatpak
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          bundle: snap-${{ github.ref_name }}.flatpak
          manifest-path: packaging/flatpak/de.snap.desktop.yml
          upload-artifact: false
          cache: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak
          path: snap-${{ github.ref_name }}.flatpak

  sbom:
    name: Stücklisten (SBOM, CycloneDX)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2
        with:
          tool: cargo-cyclonedx
      - name: SBOMs erzeugen
        run: |
          mkdir -p out
          cargo cyclonedx --format json --spec-version 1.5
          (cd apps/desktop/src-tauri && cargo cyclonedx --format json --spec-version 1.5)
          find . -name "*.cdx.json" -not -path "./out/*" -not -path "*/node_modules/*" | while read -r f; do
            cp "$f" "out/sbom-rust-$(echo "${f#./}" | tr '/' '_')"
          done
          (cd apps/desktop && npm ci --no-fund --no-audit --ignore-scripts && npm sbom --omit dev --sbom-format cyclonedx > ../../out/sbom-npm-desktop.cdx.json)
          (cd apps/mobile/app && npm ci --no-fund --no-audit --ignore-scripts && npm sbom --omit dev --sbom-format cyclonedx > ../../../out/sbom-npm-android.cdx.json)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: out/

  publish:
    name: Release veröffentlichen
    needs: [apk, linux, flatpak, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Prüfsummen
        working-directory: dist
        run: sha256sum -- * | tee SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Snap $GITHUB_REF_NAME" \
            --notes "Prüfen: siehe docs/RELEASES.md (Prüfsummen, Herkunftsnachweis, APK-Zertifikat)." --verify-tag
