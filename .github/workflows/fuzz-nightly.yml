# Längeres Fuzzing jede Nacht; Funde werden als Artefakt gespeichert.
name: Fuzzing (nächtlich)

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [invite_code, ledger_entry, ipc_frame, paths, live_msg, search_query, trashinfo, ops_request, media, stream_range, backup_chunker, backup_keyfile, timeline_input]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2
        with:
          tool: cargo-fuzz
      - name: 20 Minuten fuzzen
        working-directory: fuzz
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} -- -max_total_time=1200 -rss_limit_mb=2048
      - name: Funde sichern
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts
