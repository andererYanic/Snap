name: Flatpak

# Baut die Desktop-App als Flatpak (Artefakt `snap.flatpak`). Läuft bei Änderungen an der
# Paketierung oder an der Desktop-App sowie auf main; Releases hängen das Bündel später an.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "packaging/flatpak/**"
      - "apps/desktop/**"
      - ".github/workflows/flatpak.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flatpak:
    name: Flatpak bauen
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          bundle: snap.flatpak
          manifest-path: packaging/flatpak/de.snap.desktop.yml
          cache-key: flatpak-builder-${{ hashFiles('Cargo.lock', 'apps/desktop/src-tauri/Cargo.lock', 'apps/desktop/package-lock.json') }}
