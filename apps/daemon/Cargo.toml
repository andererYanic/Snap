[package]
name = "space-daemon"
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.91"

[dependencies]
space-core = { path = "../../core" }
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
chrono = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
