[package]
name = "space-daemon"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false
rust-version = "1.91"

[dependencies]
space-core = { path = "../../core" }
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
jiff = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Systemmitteilungen (Snap Drop bei geschlossener App) über den Sitzungsbus
zbus = { version = "6", default-features = false, features = ["tokio", "proxy"] }
tokio-stream = "0.1"
