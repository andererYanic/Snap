<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Geteilte Datei</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <h1 id="name">Geteilte Datei</h1>
  <p id="info">Wird geladen …</p>
  <form id="pwform" hidden>
    <label for="pw">Diese Datei ist mit einem Passwort geschützt:</label>
    <input id="pw" type="password" autocomplete="off" required>
    <button type="submit">Entsperren</button>
  </form>
  <button id="download" hidden>Herunterladen</button>
  <progress id="progress" max="1" value="0" hidden></progress>
  <p id="status" role="status"></p>
  <footer>Ende-zu-Ende-verschlüsselt mit Snap – der Server kennt weder Inhalt noch Dateiname.</footer>
</main>
<script type="module" src="/app.js"></script>
</body>
</html>
